name: Load test
on: [workflow_dispatch]
permissions:
  contents: read
  id-token: write
env:
  # For AZURE_WEBAPP_NAME enter just the name, not the full URL.
  RESOURCE_GROUP: az2006-rg
  LOAD_TEST_RESOURCE: az2006loadtest
  AZURE_WEBAPP_NAME: az2006app18114
jobs:
  # This workflow consists of a single job called "loadtest"
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      #Login in your azure subscription using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Run the load test
      - name: Azure Load Testing
        uses: azure/load-testing@v1.1.28
        with:
          loadTestConfigFile: 'config.yaml'
          loadTestResource: ${{ env.LOAD_TEST_RESOURCE}}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          env: |
            [{
              "name": "webapp",
              "value": "${{ env.AZURE_WEBAPP_NAME }}"
            }]
      - uses: actions/upload-artifact@v4
        with:
          name: loadTestResults
          path: ${{ github.workspace }}/loadTest
          # upload the published website code artifacts
          if-no-files-found: warn
